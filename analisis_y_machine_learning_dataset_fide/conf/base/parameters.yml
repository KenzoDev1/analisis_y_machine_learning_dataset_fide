# Parámetros Kedro: Proyecto FIDE Chess — SCY1101

# ==========================================
# Limpieza de datos (Indicador 4)
# ==========================================
cleaning:
  iqr_factor: 1.5          # Factor multiplicador para detección de outliers IQR
  min_yob: 1900            # Año de nacimiento mínimo aceptable
  max_yob: 2015            # Año de nacimiento máximo aceptable

# ==========================================
# Transformación de datos (Indicador 5)
# ==========================================
transform:
  expert_threshold: 2000   # ELO mínimo para clasificar como "experto"
  base_year: 2021          # Año de referencia para calcular edad aproximada

# ==========================================
# Split Train/Test
# ==========================================
split:
  test_size: 0.2
  random_state: 42

# ==========================================
# Subsampling para Colab (Optimización 1)
# ==========================================
sampling:
  sample_size: 100000   # Máximo de filas para ML (null = usar todo el dataset)
  random_state: 42

# ==========================================
# Configuración de modelos (referencia)
# ==========================================
model_options:
  target: is_expert
  features:
    - rating_std_avg
    - rating_change
    - total_months_active
    - age_approx
    - gender_encoded
    - title_encoded

# ==========================================
# Hyperparameter Tuning — Colab (Optimización 3)
# ==========================================
tuning:
  cv: 3
  n_iter_random: 8
  grids:
    LogisticRegression:
      classifier__C: [0.1, 1, 10]
      classifier__penalty: ["l2"]
      classifier__solver: ["lbfgs"]
    RandomForest:
      classifier__n_estimators: [50, 100]
      classifier__max_depth: [5, 10]
      classifier__min_samples_split: [2, 5]
    GradientBoosting:
      classifier__n_estimators: [50, 100]
      classifier__max_depth: [3, 5]
      classifier__learning_rate: [0.1, 0.2]

# ==========================================
# Evaluación de modelos — Colab (Optimización 3)
# ==========================================
evaluation:
  cv: 3

# ==========================================
# Aprendizaje no supervisado (Optimización 4)
# ==========================================
clustering:
  silhouette_sample_size: 10000
  training_sample_size: 50000
